name: Private package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    env:
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: examples/benchmarks/requirements.lock.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r examples/benchmarks/requirements.lock.txt
      - run: npm run prepare:ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:ci
      - run: npm install --global --ignore-scripts @openai/codex@0.144.6
      # The hosted Windows runner repeatedly unpacked cached dependencies slowly in C: system temp.
      - name: Use runner scratch for Windows installation checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskScratch = $env:RUNNER_TEMP
          if (-not (Test-Path -LiteralPath $taskScratch -PathType Container)) { throw 'RUNNER_TEMP must identify an existing directory' }
          "TEMP=$taskScratch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$taskScratch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run test:plugin
      - run: npm run test:package

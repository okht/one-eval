name: Windows plugin diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Windows / Node 24 / plugin only
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
      npm_config_loglevel: info
      npm_config_timing: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --global --ignore-scripts @openai/codex@0.144.6
      - run: npm run test:plugin
      - name: Record diagnostic paths without credentials or configuration contents
        if: always()
        shell: pwsh
        run: |
          $taskDiagnosticDirectory = Join-Path $env:GITHUB_WORKSPACE 'results/plugin-ci-diagnostic'
          New-Item -ItemType Directory -Path $taskDiagnosticDirectory -Force | Out-Null
          $taskNpmCache = (& npm config get cache | Select-Object -Last 1).Trim()
          $taskNpmLogs = Join-Path $taskNpmCache '_logs'
          $taskLogIndex = @(Get-ChildItem -LiteralPath $taskNpmLogs -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '-debug-\d+\.log$|-timing\.json$' } |
            Sort-Object LastWriteTimeUtc |
            Select-Object @{Name='path';Expression={$_.FullName}}, Length, LastWriteTimeUtc)
          $taskIndex = [ordered]@{
            node = (& node --version)
            npm = (& npm --version)
            npmCache = $taskNpmCache
            npmLogPaths = $taskLogIndex
            generatedAt = [DateTime]::UtcNow.ToString('o')
          }
          $taskIndex | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $taskDiagnosticDirectory 'index.json')
      - name: Retain plugin command logs and diagnostic paths
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-plugin-diagnostic-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            results/plugin-installation-*/commands.json
            results/plugin-installation-*/failure.json
            results/plugin-installation-*/summary.json
            results/plugin-ci-diagnostic/index.json
